<div class="topo">
  <h1>Inscrições</h1>
  <a class="botao" routerLink="/inscricoes/nova">Nova inscrição</a>
</div>

<div class="cards">
  @for (inscricao of store.inscricoes(); track inscricao.email) {
    <article class="card">
      <h2>{{ inscricao.nomeCompleto }}</h2>
      <app-ficha-inscricao [inscricao]="inscricao" />
      <div class="acoes">
        <a class="botao botao--secundario" [routerLink]="['/inscricoes', inscricao.email]">Detalhes</a>
        <a class="botao botao--secundario" [routerLink]="['/inscricoes', inscricao.email, 'editar']">
          Editar
        </a>
        <button type="button" class="botao botao--perigo" (click)="cancelar(inscricao)">
          Cancelar inscrição
        </button>
      </div>
    </article>
  } @empty {
    <p class="vazio">Nenhuma inscrição até o momento.</p>
  }
</div>
