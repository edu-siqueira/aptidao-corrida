@if (inscricao(); as inscricao) {
  <article class="card">
    <h1>{{ inscricao.nomeCompleto }}</h1>
    <app-ficha-inscricao [inscricao]="inscricao" />
    <div class="acoes">
      <a class="botao botao--secundario" routerLink="/inscricoes">Voltar para a lista</a>
      <a class="botao" [routerLink]="['/inscricoes', inscricao.email, 'editar']">Editar</a>
      <button type="button" class="botao botao--perigo" (click)="cancelar()">Cancelar inscrição</button>
    </div>
  </article>
} @else {
  <app-inscricao-nao-encontrada [email]="email()" />
}
